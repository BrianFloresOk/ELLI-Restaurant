version: '3.9'

services:
  db:
    image: postgres:15
    container_name: elli_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elli_backend
    restart: always
    depends_on:
      - db
    env_file:
      - ./backend/.env
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "yarn install && yarn dev"

  frontend:
    build:
      context: ./frontend/pos-elli
      dockerfile: Dockerfile
    container_name: elli_frontend
    restart: always
    env_file:
      - ./frontend/pos-elli/.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/pos-elli:/app
      - /app/node_modules
    command: sh -c "yarn install && yarn dev"

volumes:
  db_data:
